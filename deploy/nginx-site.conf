# AETHER — Nginx server block for a BARE-METAL Linux install.
# install.sh copies this to /etc/nginx/sites-available/aether and
# replaces __DOMAIN__ / __ROOT__ automatically.
# Manual use:  sed -e 's#__DOMAIN__#example.com#' -e 's#__ROOT__#/var/www/aether#' \
#                deploy/nginx-site.conf | sudo tee /etc/nginx/sites-available/aether
server {
    listen       80;
    listen       [::]:80;
    server_name  __DOMAIN__;
    root         __ROOT__;
    index        index.html;

    # ── Compression ──────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml text/xml font/woff2;

    # ── Security headers (add HSTS after enabling HTTPS) ─────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted assets → cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images / fonts → long cache
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback + never cache the HTML shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;

    access_log /var/log/nginx/aether.access.log;
    error_log  /var/log/nginx/aether.error.log;
}
